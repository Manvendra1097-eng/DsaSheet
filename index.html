<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DSA Sheet Tracker</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link
            rel="icon"
            type="image/png"
            href="./favicon-96x96.png"
            sizes="96x96"
        />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="shortcut icon" href="./favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="./apple-touch-icon.png"
        />
        <link rel="manifest" href="./site.webmanifest" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            display: ["Bricolage Grotesque", "sans-serif"],
                            mono: ["IBM Plex Mono", "monospace"],
                        },
                        colors: {
                            border: "var(--border)",
                            input: "var(--input)",
                            ring: "var(--ring)",
                            background: "var(--background)",
                            foreground: "var(--foreground)",
                            card: {
                                DEFAULT: "var(--card)",
                                foreground: "var(--card-foreground)",
                            },
                            primary: {
                                DEFAULT: "var(--primary)",
                                foreground: "var(--primary-foreground)",
                            },
                            secondary: {
                                DEFAULT: "var(--secondary)",
                                foreground: "var(--secondary-foreground)",
                            },
                            muted: {
                                DEFAULT: "var(--muted)",
                                foreground: "var(--muted-foreground)",
                            },
                            accent: {
                                DEFAULT: "var(--accent)",
                                foreground: "var(--accent-foreground)",
                            },
                            destructive: {
                                DEFAULT: "var(--destructive)",
                                foreground: "var(--destructive-foreground)",
                            },
                        },
                        boxShadow: {
                            glass: "0 20px 50px -18px color-mix(in srgb, var(--shadow) 45%, transparent)",
                        },
                    },
                },
            };
        </script>
        <link rel="stylesheet" href="./src/styles.css" />
    </head>
    <body class="font-display text-foreground antialiased">
        <div class="bg-orb orb-a"></div>
        <div class="bg-orb orb-b"></div>
        <div class="bg-grid"></div>

        <header
            class="sticky top-0 z-30 border-b border-border/60 bg-background/80 backdrop-blur-md"
        >
            <div
                class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-3 md:flex-row md:items-center md:justify-between md:px-6"
            >
                <div>
                    <p
                        class="font-mono text-xs uppercase tracking-[0.22em] text-primary"
                    >
                        Striver A2Z
                    </p>
                    <p class="mt-0.5 text-sm text-muted-foreground">
                        Build consistency, one problem at a time.
                    </p>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <button
                        id="paletteToggleBtn"
                        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-border bg-secondary text-secondary-foreground transition-colors hover:bg-secondary/70"
                        type="button"
                        title="Switch color palette"
                        aria-label="Switch color palette (Amber / Orange)"
                    >
                        <svg
                            aria-hidden="true"
                            viewBox="0 0 24 24"
                            class="h-4 w-4"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <path
                                d="M12 21a9 9 0 1 1 0-18c4.97 0 9 3.5 9 7.5 0 2.49-2.01 3.5-4 3.5h-2.05a1.5 1.5 0 0 0-1.05 2.56c.4.4.6.9.6 1.44 0 1.1-1.12 2-2.5 2Z"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <circle
                                cx="7.5"
                                cy="10.5"
                                r="1.1"
                                fill="currentColor"
                                stroke="none"
                            />
                            <circle
                                cx="11.5"
                                cy="7"
                                r="1.1"
                                fill="currentColor"
                                stroke="none"
                            />
                            <circle
                                cx="15.5"
                                cy="9"
                                r="1.1"
                                fill="currentColor"
                                stroke="none"
                            />
                        </svg>
                    </button>

                    <button
                        id="themeToggleBtn"
                        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-border bg-secondary text-secondary-foreground transition-colors hover:bg-secondary/70"
                        type="button"
                        title="Toggle theme"
                        aria-label="Toggle dark theme"
                    >
                        <svg
                            id="themeIconMoon"
                            aria-hidden="true"
                            viewBox="0 0 24 24"
                            class="h-4 w-4"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <path
                                d="M21 12.8A9 9 0 1 1 11.2 3a7.2 7.2 0 0 0 9.8 9.8Z"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <svg
                            id="themeIconSun"
                            aria-hidden="true"
                            viewBox="0 0 24 24"
                            class="is-hidden h-4 w-4"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>

                    <div id="guestAuth" class="flex items-center gap-2">
                        <button
                            id="loginBtn"
                            class="inline-flex h-10 items-center gap-2 rounded-full bg-primary px-4 text-sm font-semibold text-primary-foreground shadow-sm transition-opacity hover:opacity-90"
                        >
                            <svg
                                aria-hidden="true"
                                viewBox="0 0 24 24"
                                class="h-4 w-4"
                            >
                                <path
                                    fill="currentColor"
                                    d="M21.6 12.23c0-.68-.06-1.36-.18-2H12v3.79h5.4a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 3-4.32 3-7.31Z"
                                    opacity=".9"
                                />
                                <path
                                    fill="currentColor"
                                    d="M12 22c2.7 0 4.97-.89 6.63-2.42l-3.24-2.5c-.9.6-2.06.96-3.4.96-2.6 0-4.8-1.76-5.6-4.12H3.05v2.58A10 10 0 0 0 12 22Z"
                                    opacity=".7"
                                />
                                <path
                                    fill="currentColor"
                                    d="M6.4 13.92a6 6 0 0 1 0-3.84V7.5H3.05a10 10 0 0 0 0 9l3.35-2.58Z"
                                    opacity=".5"
                                />
                                <path
                                    fill="currentColor"
                                    d="M12 6.06c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.94 9.94 0 0 0 12 2 10 10 0 0 0 3.05 7.5l3.35 2.58c.8-2.36 3-4.02 5.6-4.02Z"
                                />
                            </svg>
                            Sign in with Google
                        </button>
                    </div>

                    <div
                        id="userAuth"
                        class="is-hidden flex items-center gap-2"
                    >
                        <p
                            id="userName"
                            class="hidden max-w-40 truncate font-mono text-sm text-muted-foreground md:block"
                        ></p>
                        <button
                            id="avatarMenuBtn"
                            class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-border bg-background/80 ring-offset-background transition hover:ring-2 hover:ring-ring/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
                            aria-haspopup="menu"
                            aria-expanded="false"
                            aria-controls="userMenu"
                            type="button"
                        >
                            <img
                                id="userAvatar"
                                class="h-9 w-9 rounded-full object-cover"
                                src=""
                                alt="User avatar"
                            />
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="relative mx-auto max-w-6xl px-4 pb-8 pt-5 md:px-6">
            <header
                class="mb-4 rounded-2xl border border-border/70 bg-card/70 p-5 shadow-glass backdrop-blur"
            >
                <h1 class="text-3xl font-extrabold tracking-tight md:text-5xl">
                    DSA Progress Tracker
                </h1>
                <p
                    class="mt-2 max-w-2xl text-sm text-muted-foreground md:text-base"
                >
                    Track solved and attempted problems across devices with
                    Firebase login sync.
                </p>
                <p
                    id="syncStatus"
                    class="mt-3 inline-flex items-center gap-2 rounded-full border border-border/80 bg-secondary/60 px-3 py-1.5 text-xs font-medium text-secondary-foreground md:text-sm"
                >
                    <span
                        id="syncStatusDot"
                        class="h-2 w-2 shrink-0 rounded-full bg-muted-foreground/60"
                    ></span>
                    <span id="syncStatusText">Waiting for login</span>
                </p>
            </header>

            <section
                class="grid grid-cols-2 gap-3 md:grid-cols-4"
                id="statsGrid"
            ></section>

            <section
                class="mt-4 rounded-2xl border border-border/70 bg-card/70 p-4 shadow-glass backdrop-blur"
            >
                <h2 class="text-lg font-bold tracking-tight">Filters</h2>
                <div class="mt-3 grid grid-cols-1 gap-2 md:grid-cols-12">
                    <input
                        id="searchInput"
                        class="col-span-1 rounded-md border border-input bg-background px-3 py-2 text-sm outline-none ring-offset-background placeholder:text-muted-foreground focus-visible:ring-2 focus-visible:ring-ring md:col-span-5"
                        type="text"
                        placeholder="Search problems..."
                    />
                    <select
                        id="topicFilter"
                        class="col-span-1 rounded-md border border-input bg-background px-3 py-2 text-sm outline-none ring-offset-background focus-visible:ring-2 focus-visible:ring-ring md:col-span-4"
                    >
                        <option value="all">All Topics</option>
                    </select>
                    <select
                        id="difficultyFilter"
                        class="col-span-1 rounded-md border border-input bg-background px-3 py-2 text-sm outline-none ring-offset-background focus-visible:ring-2 focus-visible:ring-ring md:col-span-2"
                    >
                        <option value="all">All Difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                    <select
                        id="statusFilter"
                        class="col-span-1 rounded-md border border-input bg-background px-3 py-2 text-sm outline-none ring-offset-background focus-visible:ring-2 focus-visible:ring-ring md:col-span-1"
                    >
                        <option value="all">All Status</option>
                        <option value="not-started">Not Started</option>
                        <option value="attempted">Attempted</option>
                        <option value="solved">Solved</option>
                    </select>
                </div>
            </section>

            <section id="stepsContainer" class="mt-4 grid gap-3"></section>
        </main>

        <div
            id="userMenu"
            class="is-hidden pointer-events-none fixed z-50 w-56 origin-top-right scale-95 rounded-xl border border-border bg-card/95 p-1.5 opacity-0 shadow-xl ring-1 ring-border/50 backdrop-blur transition duration-150 ease-out"
            role="menu"
            aria-label="User menu"
        >
            <button
                id="syncNowBtn"
                class="inline-flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm font-medium text-foreground transition-colors hover:bg-secondary"
                role="menuitem"
                type="button"
            >
                <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    class="h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path
                        d="M21 12a9 9 0 1 1-2.64-6.36"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M21 3v6h-6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
                <span>Sync</span>
            </button>
            <button
                id="logoutBtn"
                class="inline-flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm font-medium text-foreground transition-colors hover:bg-secondary"
                role="menuitem"
                type="button"
            >
                <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    class="h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path
                        d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M16 17l5-5-5-5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M21 12H9"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
                <span>Logout</span>
            </button>
        </div>

        <script type="module" src="./src/main.js"></script>
    </body>
</html>
