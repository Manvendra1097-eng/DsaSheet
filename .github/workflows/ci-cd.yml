name: CI/CD

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Check JS syntax
              run: |
                  set -e
                  find . -name "*.js" -not -path "./.git/*" | while read -r file; do
                      echo "Checking $file"
                      node --check "$file"
                  done

            - name: Ensure real secrets file is not committed
              run: |
                  if [ -f src/firebase-config.js ]; then
                      echo "::error::src/firebase-config.js must never be committed. It is generated at deploy time from secrets."
                      exit 1
                  fi

            - name: Ensure example config template exists
              run: test -f src/firebase-config.example.js

    deploy:
        name: Deploy
        needs: validate
        if: github.event_name != 'pull_request'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Create firebase-config.js from secrets
              run: |
                  cat > src/firebase-config.js << EOF
                  export const FIREBASE_CONFIG = {
                      apiKey: "${{ secrets.FIREBASE_API_KEY }}",
                      authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
                      databaseURL: "${{ secrets.FIREBASE_DATABASE_URL }}",
                      projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
                      storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
                      messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
                      appId: "${{ secrets.FIREBASE_APP_ID }}",
                      measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}",
                  };
                  EOF

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: .

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
