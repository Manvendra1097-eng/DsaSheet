name: CI/CD

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Ensure real secrets file is not committed
              run: |
                  if [ -f .env ] || [ -f .env.local ] || [ -f src/firebase-config.js ]; then
                      echo "::error::Local env/secrets files must never be committed. They are generated at deploy time."
                      exit 1
                  fi

            - name: Ensure example env template exists
              run: test -f .env.example

            - name: Build (sanity check)
              run: npm run build
              env:
                  VITE_FIREBASE_API_KEY: "REPLACE_ME"
                  VITE_FIREBASE_AUTH_DOMAIN: "REPLACE_ME"
                  VITE_FIREBASE_DATABASE_URL: "REPLACE_ME"
                  VITE_FIREBASE_PROJECT_ID: "REPLACE_ME"
                  VITE_FIREBASE_STORAGE_BUCKET: "REPLACE_ME"
                  VITE_FIREBASE_MESSAGING_SENDER_ID: "REPLACE_ME"
                  VITE_FIREBASE_APP_ID: "REPLACE_ME"
                  VITE_FIREBASE_MEASUREMENT_ID: "REPLACE_ME"

    deploy:
        name: Deploy
        needs: validate
        if: github.event_name != 'pull_request'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Build with secrets
              run: npm run build
              env:
                  VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
                  VITE_FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
                  VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
                  VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
